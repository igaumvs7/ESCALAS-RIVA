name: CI

# Antes disso não existia pipeline nenhum (04-CHECKLIST de produção,
# 2026-09-20): os testes Playwright e a validação de SQL já existiam no
# repositório, mas só rodavam se alguém lembrasse de rodar na mão. Isso não
# toca em nada do que já está em produção — só passa a rodar, a cada push e
# pull request, o que já existia, avisando ANTES de um deploy quebrado.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar SQL das migrations
        run: npm run validate:sql

      - name: Typecheck + build
        run: npm run build

      - name: Instalar navegadores do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes E2E do wizard de setup
        run: npx playwright test

      - name: Publicar relatório do Playwright em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/.artifacts/html
          retention-days: 7
